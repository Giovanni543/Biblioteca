<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Perfil</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
              crossorigin="anonymous">
        <style>
            .profile-photo {
                width: 180px;
                height: 180px;
                object-fit: cover;
            }
            .sale-card {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .sale-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .10) !important;
            }
            .hidden-sale {
                display: none;
            }
            .book-row {
                border-bottom: 1px solid #eeeeee;
                padding: 10px 0;
            }
            .book-row:last-child {
                border-bottom: none;
            }
        </style>
    </head>
    <body>
        <nav th:replace="fragments/fragments::navbar"></nav>
        <div class="container mt-5 mb-5">
            <div class="text-center mb-4">
                <h1>Perfil de Customer</h1>
                <p class="text-muted">
                    Información personal e historial de compras
                </p>
            </div>

            <!-- DATOS DEL CUSTOMER -->

            <div class="card shadow border-0 mb-4">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        Datos personales
                    </h4>
                </div>
                <div class="card-body">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">
                                Nombre
                            </label>
                            <input type="text"
                                   readonly
                                   class="form-control"
                                   th:value="${customer.name}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">
                                Apellido
                            </label>
                            <input type="text"
                                   readonly
                                   class="form-control"
                                   th:value="${customer.lastName}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">
                                DNI
                            </label>
                            <input type="text"
                                   readonly
                                   class="form-control"
                                   th:value="${customer.dni}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">
                                Dirección de mail
                            </label>
                            <input type="email"
                                   readonly
                                   class="form-control"
                                   th:value="${customer.email}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">
                                Rol
                            </label>
                            <input type="text"
                                   readonly
                                   class="form-control"
                                   th:value="${customer.role}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">
                                Balance
                            </label>
                            <input type="text"
                                   readonly
                                   class="form-control"
                                   th:value="${customer.balance}">
                        </div>
                        <div class="d-flex gap-2">

                            <a th:href="@{/customer/edit-profile}"
                               class="btn btn-success">
                                Editar perfil
                            </a>
                            <a th:href="@{/customer/cart}"
                               class="btn btn-success">
                                Ver carrito
                            </a>

                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/customer/addBalance}"
                                  method="post"
                                  class="m-0">

                                <button type="submit"
                                        class="btn btn-success">
                                    + $100.000
                                </button>
                            </form>
                        </div>
                        <p th:if="${error != null}"
                           th:text="${error}"
                           class="text-danger mt-3">
                        </p>
                    </div>
                </div>
                <div class="row">
                    <!-- FOTO DE PERFIL -->
                    <!-- ================================================= -->

                    <div class="col-lg-3 mb-4">
                        <div class="card shadow border-0">
                            <div class="card-body text-center">
                                <h5 class="mb-4">
                                    Mi perfil
                                </h5>
                                <!-- FOTO EXISTENTE -->
                                <img th:if="${customer.photo != null}"
                                     th:src="@{/customer/photo/{id}(id=${customer.photo.id})}"
                                     class="rounded-circle img-fluid shadow profile-photo"
                                     alt="Foto de perfil">

                                <!-- FOTO POR DEFECTO -->
                                <img th:if="${customer.photo == null}"
                                     src="https://via.placeholder.com/180"
                                     class="rounded-circle img-fluid shadow profile-photo"
                                     alt="Foto de perfil">
                                <h4 class="mt-3"
                                    th:text="${customer.name}">
                                    Nombre
                                </h4>
                                <p class="text-muted mb-0"
                                   th:text="${customer.email}">
                                    email
                                </p>
                            </div>
                        </div>
                    </div>
                    <!-- HISTORIAL -->
                    <!-- ================================================= -->
                    <div class="col-lg-9">
                        <div class="card shadow border-0">
                            <div class="card-header bg-success text-white">
                                <h4 class="mb-0">
                                    Historial de compras
                                </h4>
                            </div>
                            <div class="card-body">
                                <!-- SIN COMPRAS -->
                                <!-- ===================================== -->
                                <div th:if="${customer.purchaseHistory.empty}"
                                     class="text-center text-muted py-4">
                                    <h5>
                                        Todavía no realizaste ninguna compra.
                                    </h5>
                                    <p class="mb-0">
                                        Cuando realices una compra aparecerá aquí.
                                    </p>
                                </div>
                                <!-- COMPRAS -->
                                <!-- ===================================== -->
                                <div th:each="sale, stat : ${customer.purchaseHistory}"
                                     class="card sale-card mb-3 border"
                                     th:classappend="${stat.index >= 3} ? ' hidden-sale' : ''">
                                    <div class="card-body">
                                        <!-- CABECERA DE LA COMPRA -->
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h5 class="mb-1">
                                                    Compra:
                                                    <span class="text-muted"
                                                          th:text="'#' + ${sale.id}">
                                                    </span>
                                                </h5>
                                                <small class="text-muted">
                                                    Fecha:
                                                    <span th:text="${sale.saleDate != null 
                                                          ? #temporals.format(sale.saleDate, 'dd/MM/yyyy HH:mm') 
                                                          : 'Sin fecha'}">
                                                    </span>
                                                </small>
                                            </div>
                                            <!-- TOTAL -->
                                            <div class="text-end">
                                                <strong class=" d-block">
                                                    Total
                                                </strong>
                                                <strong class="text-success fs-5">
                                                    $
                                                    <span th:text="${sale.totalAmount}">
                                                    </span>
                                                </strong>
                                            </div>
                                        </div>
                                        <hr>
                                        <!-- LIBROS DE LA VENTA -->
                                        <!-- ================================= -->
                                        <div th:each="item : ${sale.saleItems}"
                                             class="book-row">
                                            <div class="row align-items-center">
                                                <!-- NOMBRE -->
                                                <div class="col-md-7">
                                                    <strong th:text="${item.book.name}">
                                                        Nombre del libro
                                                    </strong>
                                                </div>
                                                <!-- CANTIDAD -->
                                                <div class="col-md-2 text-center">
                                                    <span class="text-muted">
                                                        Cantidad:
                                                    </span>
                                                    <strong>
                                                        x<span th:text="${item.quantity}">
                                                        </span>
                                                    </strong>
                                                </div>

                                                <!-- PRECIO -->
                                                <div class="col-md-3 text-end">
                                                    $
                                                    <span th:text="${item.book.price}">
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- BOTÓN MOSTRAR MÁS -->
                                <div th:if="${customer.purchaseHistory.size() > 3}"
                                     class="text-center mt-4">
                                    <button type="button"
                                            id="showMoreButton"
                                            class="btn btn-outline-success">
                                        Mostrar más
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- JAVASCRIPT -->
            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    const button = document.getElementById("showMoreButton");
                    if (button) {
                        button.addEventListener("click", function () {
                            const hiddenSales =
                                    document.querySelectorAll(".hidden-sale");
                            hiddenSales.forEach(function (sale) {
                                sale.style.display = "block";
                            });
                            button.style.display = "none";
                        });
                    }
                });
            </script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
                    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
                    crossorigin="anonymous">
            </script>
    </body>
</html>
