<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${book.name}">Libro</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <nav th:replace="fragments/fragments :: navbar"></nav>
        <div class="container my-5">
            <div class="card shadow-lg border-0">
                <div class="row g-0">

                    <!-- PORTADA -->
                    <div class="col-md-4 text-center p-4">
                        <img th:if="${book.photo != null}"
                             th:src="@{/book/photo/{id}(id=${book.photo.id})}"
                             width="350" height="350">
                        <img th:if="${book.photo == null}"
                             src="https://via.placeholder.com/350x500?text=Sin+Portada"
                             class="img-fluid rounded shadow"
                             alt="Sin portada">
                    </div>
                    <!-- INFORMACIÓN -->
                    <div class="col-md-8">
                        <div class="card-body position-relative">

                            <div th:if="${success}" id="mensajeCarrito"
                                 class="alert alert-success position-absolute top-0 end-0 mt-3 me-3 shadow">
                                <i class="bi bi-check-circle-fill"></i>
                                Libro agregado al carrito
                            </div>

                            <h1 class="card-title mb-4"
                                th:text="${book.name}">
                                nombre del libro
                            </h1>
                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <strong>Género:</strong>
                                    <span th:text="${book.category}"></span>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <strong>Stock disponible:</strong>
                                    <span th:text="${book.stock}"></span>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <strong>Precio:</strong>
                                    $<span th:text="${book.price}"></span>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <strong>paginas:</strong>
                                    <span th:text="${book.pages}"></span>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <strong>Autor: </strong>
                                    <span th:text="${book.author.name}"></span>
                                </div>

                            </div>
                            <div class="col-md-6 mb-3">
                                <strong>Descripción:</strong>
                                <span th:text="${book.description}"></span>
                            </div>

                            <hr>
                            <!-- BOTÓN DE COMPRA -->
                            <div class="mt-5">
                                <a sec:authorize="hasAnyRole('ADMIN')" th:href="@{/customer/buyBook(id=${book.id})}" class="btn btn-success btn-lg">
                                    Comprar Libro Ahora
                                </a>
                                <form sec:authorize="hasAnyRole('ADMIN')" th:action="@{/customer/cart/add}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${book.id}">
                                    <button type="submit" class="btn btn-outline-success btn-lg">
                                        Agregar Al Carrito
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            window.addEventListener("load", function () {
                const mensaje = document.getElementById("mensajeCarrito");
                if (mensaje) {
                    setTimeout(function () {
                        mensaje.style.transition = "opacity .5s";
                        mensaje.style.opacity = "0";

                        setTimeout(function () {
                            mensaje.remove();
                        }, 500);
                    }, 6000);
                }
            });
        </script>
    </body>
</html>
